<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Browser Gateway</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Browser Gateway</h1>
          <p>私人美国出口</p>
        </div>
        <span id="stateBadge" class="badge off">未开启</span>
      </header>

      <section id="notice" class="notice hidden" role="status"></section>

      <section class="enrollment">
        <h2>设备注册</h2>
        <label>统计服务器
          <input id="enrollmentServer" type="url" placeholder="https://服务器IP:9443">
        </label>
        <label>一次性注册码
          <input id="enrollmentCode" autocomplete="off" maxlength="9" placeholder="ABCD-2345">
        </label>
        <div class="actions">
          <button id="enrollButton" class="secondary" type="button">注册这台设备</button>
          <button id="dashboardButton" class="secondary" type="button">打开用量统计</button>
        </div>
        <button id="syncBridgeButton" class="secondary sync-button" type="button" hidden>重新同步到 AI Bridge</button>
        <p id="enrollmentState">尚未注册</p>
      </section>

      <form id="settingsForm">
        <label>代理模式
          <select id="routingMode">
            <option value="rule">规则模式（中国大陆直连）</option>
            <option value="global">全局模式（全部走服务器）</option>
            <option value="direct">直连模式（不经过服务器）</option>
          </select>
        </label>
        <label>服务器
          <input id="host" autocomplete="off" required>
        </label>
        <label class="small">端口
          <input id="port" type="number" min="1" max="65535" required>
        </label>
        <label>用户名
          <input id="username" autocomplete="username" required>
        </label>
        <label>密码
          <input id="password" type="password" autocomplete="current-password" placeholder="留空保持现有密码">
        </label>
        <label>预期出口 IP
          <input id="expectedIp" autocomplete="off">
        </label>
        <button id="saveButton" class="secondary" type="submit">保存设置</button>
      </form>

      <section class="details">
        <div><span>Chrome 控制权</span><strong id="control">—</strong></div>
        <div><span>检测出口</span><strong id="egress">尚未检测</strong></div>
        <div><span>检测延迟</span><strong id="latency">—</strong></div>
      </section>

      <div class="actions">
        <button id="toggleButton" class="primary" type="button">开启代理</button>
        <button id="testButton" class="secondary" type="button">检测连接</button>
      </div>

      <section class="update">
        <h2>安装与升级</h2>
        <label>Browser Gateway 目录
          <input id="installRoot" autocomplete="off" placeholder="默认：文档\\browser-gateway">
        </label>
        <button id="updateButton" class="secondary" type="button">检查并更新 Browser Gateway</button>
        <p class="hint">通过 AI Bridge 和当前 Chrome 网络下载更新。保留为空表示原目录更新；如需迁移，直接输入目标项目文件夹的完整路径。首次换用新目录后，需在 chrome://extensions 对该目录手动“加载已解压的扩展程序”一次。</p>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
